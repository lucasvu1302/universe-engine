# Phase 1 HTTP-only bootstrap vhost for ~/apps/nginx-edge-proxy/conf.d/universe.lucasvu.io.vn.conf
# Safe to install before Let's Encrypt TLS certificates exist (HTTP port 80 only).
server {
    listen 80;
    listen [::]:80;
    server_name universe.lucasvu.io.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:18210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP "";
        proxy_read_timeout 60s;
    }
}
